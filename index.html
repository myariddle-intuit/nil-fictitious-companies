function nameHash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)+s.charCodeAt(i)|0;return Math.abs(h);}
function logoColor(name){return palette[nameHash(name)%palette.length];}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function wrapText(text,max){const words=text.split(' '),lines=[];let cur='';words.forEach(w=>{if((cur+(cur?' ':'')+w).length<=max){cur+=(cur?' ':'')+w;}else{if(cur)lines.push(cur);cur=w;}});if(cur)lines.push(cur);return lines;}
function hFontSize(name){const lines=wrapText(name,16);const longest=Math.max(...lines.map(l=>l.length));const fs=Math.floor(380/(longest*0.72));return Math.min(Math.max(fs,11),30);}

const headCache={};
async function fetchHeadshot(c){
  if(headCache[c.owner])return headCache[c.owner];
  // Use local ChatGPT headshot if available
  if(localHeadshots[c.owner]){
    const result={img:localHeadshots[c.owner],src:'local'};
    headCache[c.owner]=result;return result;
  }
  // Fall back to randomuser.me for remaining 4
  const nat=ownerNat(c),g=c.gender==='female'?'female':'male',seed=encodeURIComponent(c.owner);
  try{
    const res=await fetch(`https://randomuser.me/api/?seed=${seed}&gender=${g}&nat=${nat}&results=1`);
    const data=await res.json();
    const p=data.results[0];
    const result={img:p.picture.large,src:'https://randomuser.me'};
    headCache[c.owner]=result;return result;
  }catch(e){
    const fallback={img:`https://randomuser.me/api/portraits/${g==='female'?'women':'men'}/${nameHash(c.owner)%99}.jpg`,src:'https://randomuser.me'};
    headCache[c.owner]=fallback;return fallback;
  }
}

// ── Modal ──────────────────────────────────────────────────────────────────
let modalCompany=null;

async function openModal(name){
  modalCompany=companies.find(x=>x.name===name);
  if(!modalCompany)return;
  const c=modalCompany;
  document.getElementById('m-title').textContent=c.name;
  document.getElementById('m-sub').textContent=c.owner+'  ·  '+c.type+'  ·  '+c.category;
  document.getElementById('m-hlogo').innerHTML=makeHorizSVG(c);
  document.getElementById('m-vlogo').innerHTML=makeVertSVG(c);
  const hshot=document.getElementById('m-headshot');
  hshot.innerHTML='<div class="photo-loading">Loading headshot…</div>';
  document.getElementById('modal').classList.add('open');
  const portrait=await fetchHeadshot(c);
  hshot.innerHTML=`<img src="${portrait.img}" alt="${c.owner}" style="width:100%;height:100%;object-fit:contain;display:block;border-radius:10px;background:#F3F4F6;">`;
}

function closeModal(){document.getElementById('modal').classList.remove('open');}

function dlHeadshot(){
  if(!modalCompany)return;
  const img=document.querySelector('#m-headshot img');
  if(!img)return;
  const a=document.createElement('a');
  a.href=img.src;
  a.download='headshot_'+modalCompany.owner.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.png';
  a.click();
}

function dlModal(type){
  if(!modalCompany)return;
  const svg=type==='h'?makeHorizSVG(modalCompany):makeVertSVG(modalCompany);
  const blob=new Blob([svg],{type:'image/svg+xml'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(type==='h'?'horizontal':'vertical')+'_'+modalCompany.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.svg';
  a.click();
}

// ── List rendering ─────────────────────────────────────────────────────────
function rowHTML(c,i){
  const col=catColors[c.category]||{bg:'#455A64',light:'#ECEFF1',text:'#455A64'};
  const nameSafe=c.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return`<div class="row" onclick="openModal('${nameSafe}')">
    <span class="row-num">${i+1}</span>
    <span class="cat-dot" style="background:${col.bg}"></span>
    <span class="row-name">${esc(c.name)}</span>
    <span class="row-owner">${esc(c.owner)}</span>
    <span class="row-cat" style="background:${col.light};color:${col.text}">${esc(c.category)}</span>
    <span class="row-type">${esc(c.type)}</span>
  </div>`;
}

function renderList(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const cat=document.getElementById('catFilter').value;
  const filtered=companies.filter((c,i)=>{
    const matchQ=!q||c.name.toLowerCase().includes(q)||c.owner.toLowerCase().includes(q)||c.category.toLowerCase().includes(q)||c.type.toLowerCase().includes(q);
    const matchCat=!cat||c.category===cat;
    return matchQ&&matchCat;
  });
  document.getElementById('list').innerHTML=filtered.length?filtered.map((c,i)=>rowHTML(c,i)).join(''):`<div class="no-results">No companies match your search.</div>`;
  document.getElementById('count').textContent=filtered.length+' of '+companies.length+' companies';
}

// ── Init ───────────────────────────────────────────────────────────────────
(function init(){
  const cats=[...new Set(companies.map(c=>c.category))].sort();
  const sel=document.getElementById('catFilter');
  cats.forEach(cat=>{const o=document.createElement('option');o.value=cat;o.textContent=cat;sel.appendChild(o);});
  renderList();
})();

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
